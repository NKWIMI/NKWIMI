# Runs the Ebola Guard backend tests on GitHub's servers after every push
# that changes the backend, and on pull requests.
name: ebola-guard-tests

on:
  push:
    branches: [main]
    paths:
      - "ebola-guard/backend/**"
      - ".github/workflows/ebola-guard-tests.yml"
  pull_request:
    paths:
      - "ebola-guard/backend/**"
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ebola-guard/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ebola-guard/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The tests use a fake AI model and a fake embedder, so no API key
      # and no model download are needed.
      - name: Run tests
        run: npm test
