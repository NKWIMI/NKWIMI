{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">

            <div class="card shadow-lg border-0 rounded-3">
                <div class="card-header bg-primary text-white">
                    <h2 class="mb-0">Notification Settings</h2>
                </div>
                <div class="card-body">

                    <p class="text-muted">
                        Here you can configure your <strong>email</strong> and <strong>blockchain</strong> notifications.
                        Select the options that suit your preferences and save changes.
                    </p>

                    <form method="post">
                        {% csrf_token %}

                        <!-- Email Notifications -->
                        <div class="mb-4">
                            <h5>Email Notifications</h5>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="notif_email_transactions" name="notif_email_transactions">
                                <label class="form-check-label" for="notif_email_transactions">
                                    Receive email alerts for land transactions
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="notif_email_security" name="notif_email_security">
                                <label class="form-check-label" for="notif_email_security">
                                    Receive email alerts for security updates
                                </label>
                            </div>
                        </div>

                        <!-- Blockchain Notifications -->
                        <div class="mb-4">
                            <h5>Blockchain Notifications</h5>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="notif_chain_confirmations" name="notif_chain_confirmations">
                                <label class="form-check-label" for="notif_chain_confirmations">
                                    Notify me when my transactions are confirmed on Ethereum
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="notif_chain_failed" name="notif_chain_failed">
                                <label class="form-check-label" for="notif_chain_failed">
                                    Notify me if a transaction fails
                                </label>
                            </div>
                        </div>

                        <!-- Save Button -->
                        <div class="d-grid">
                            <button type="submit" class="btn btn-success btn-lg">
                                Save Settings
                            </button>
                        </div>
                    </form>

                </div>
            </div>

        </div>
    </div>
</div>
{% endblock %}
