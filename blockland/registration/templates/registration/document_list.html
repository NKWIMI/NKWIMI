{% extends "base.html" %}

{% block content %}
<div class="container">
    <h2>Your Documents</h2>
    {% if documents %}
        {% for document in documents %}
            <div class="card mb-3">
                <div class="card-body">
                    <h5 class="card-title">{{ document.name }}</h5>
                    <a href="{{ document.file.url }}" class="btn btn-primary" target="_blank">
                        View Document
                    </a>
                    <a href="{% url 'delete_document' pk=document.pk %}" 
                       class="btn btn-danger">
                        Delete Document
                    </a>
                </div>
            </div>
        {% endfor %}
    {% else %}
        <p>No documents uploaded yet.</p>
        <a href="{% url 'upload_document' %}" class="btn btn-primary">
            Upload Document
        </a>
    {% endif %}
</div>
{% endblock %}
