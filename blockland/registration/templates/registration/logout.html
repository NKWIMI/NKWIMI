{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} mb-3" role="alert">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
            <h2 class="mb-4">You Have Been Logged Out</h2>
            <p class="lead text-center mb-4">Thank you for using our land registration system. You can log in again or return to the homepage.</p>
            <div>
                <a href="{% url 'auth:login' %}" class="btn btn-primary btn-lg me-2">Log in Again</a>
                <a href="{% url 'home' %}" class="btn btn-secondary btn-lg">Back to Home</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
