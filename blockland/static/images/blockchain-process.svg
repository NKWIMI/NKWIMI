<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
    <style>
        .block { fill: #4e73df; }
        .chain { stroke: #6f42c1; stroke-width: 3; fill: none; }
        .text { font-family: Arial, sans-serif; font-size: 14px; fill: #333; }
    </style>
    
    <!-- Blockchain blocks -->
    <rect class="block" x="50" y="50" width="60" height="40" rx="5" />
    <rect class="block" x="150" y="50" width="60" height="40" rx="5" />
    <rect class="block" x="250" y="50" width="60" height="40" rx="5" />
    
    <!-- Connecting chain -->
    <path class="chain" d="M110 70 C135 30, 165 30, 190 70" />
    <path class="chain" d="M210 70 C235 30, 265 30, 290 70" />
    
    <!-- Process steps -->
    <circle cx="80" y="150" r="30" fill="#36b9cc" />
    <circle cx="200" y="150" r="30" fill="#1cc88a" />
    <circle cx="320" y="150" r="30" fill="#f6c23e" />
    
    <!-- Arrows between process steps -->
    <path d="M110 150 L130 150 L125 145 M130 150 L125 155" stroke="#333" stroke-width="2" fill="none" />
    <path d="M230 150 L250 150 L245 145 M250 150 L245 155" stroke="#333" stroke-width="2" fill="none" />
    
    <!-- Labels -->
    <text class="text" x="80" y="70" text-anchor="middle">Block 1</text>
    <text class="text" x="180" y="70" text-anchor="middle">Block 2</text>
    <text class="text" x="280" y="70" text-anchor="middle">Block 3</text>
    
    <text class="text" x="80" y="200" text-anchor="middle">Register</text>
    <text class="text" x="200" y="200" text-anchor="middle">Verify</text>
    <text class="text" x="320" y="200" text-anchor="middle">Secure</text>
    
    <!-- Icons inside process circles -->
    <text x="80" y="155" text-anchor="middle" fill="white" font-size="16" font-weight="bold">📄</text>
    <text x="200" y="155" text-anchor="middle" fill="white" font-size="16" font-weight="bold">✓</text>
    <text x="320" y="155" text-anchor="middle" fill="white" font-size="16" font-weight="bold">🔒</text>
</svg>