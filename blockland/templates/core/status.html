{% extends "base.html" %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-lg">
                <div class="card-header bg-primary text-white">
                    <h1 class="h4 mb-0">API Status</h1>
                </div>
                <div class="card-body text-center py-4">
                    <div class="mb-4">
                        <i class="bi bi-check-circle-fill text-success" style="font-size: 4rem;"></i>
                    </div>
                    <h2 class="h3 mb-3">Blockland API</h2>
                    
                    <div class="d-flex justify-content-center mb-4">
                        <div class="me-4">
                            <div class="h5 mb-1">Version</div>
                            <div class="text-muted">1.0.0</div>
                        </div>
                        <div>
                            <div class="h5 mb-1">Status</div>
                            <span class="badge bg-success">{{ status|default:"operational" }}</span>
                        </div>
                    </div>
                    
                    <div class="list-group list-group-flush mb-4">
                        <div class="list-group-item d-flex justify-content-between align-items-center">
                            <span>Database</span>
                            <span class="badge bg-success">Online</span>
                        </div>
                        <div class="list-group-item d-flex justify-content-between align-items-center">
                            <span>Blockchain Node</span>
                            <span class="badge bg-success">Synced</span>
                        </div>
                    </div>
                    
                    <a href="{% url 'api-docs' %}" class="btn btn-outline-primary">
                        View Full API Documentation
                    </a>
                </div>
                <div class="card-footer text-muted text-center">
                    Last updated: {% now "DATETIME_FORMAT" %}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
