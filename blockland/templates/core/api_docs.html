{% extends "base.html" %}

{% block content %}
<div class="container py-5">
    <div class="row">
        <div class="col-lg-12">
            <h1 class="display-4 fw-bold mb-4 text-primary">API Documentation</h1>
            
            <div class="card shadow-sm mb-4">
                <div class="card-header bg-primary text-white">
                    <h2 class="h5 mb-0">API Endpoints</h2>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>Endpoint</th>
                                    <th>Method</th>
                                    <th>Description</th>
                                </tr>
                            </thead>
                            <tbody>
                                {% for endpoint in api_endpoints %}
                                <tr>
                                    <td><code>{{ endpoint.endpoint }}</code></td>
                                    <td>
                                        <span class="badge 
                                            {% if endpoint.method == 'GET' %}bg-info
                                            {% elif endpoint.method == 'POST' %}bg-success
                                            {% elif endpoint.method == 'PUT' %}bg-warning
                                            {% elif endpoint.method == 'DELETE' %}bg-danger
                                            {% else %}bg-secondary{% endif %}">
                                            {{ endpoint.method }}
                                        </span>
                                    </td>
                                    <td>{{ endpoint.description }}</td>
                                </tr>
                                {% endfor %}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h2 class="h5 mb-0">Example Request</h2>
                </div>
                <div class="card-body">
                    <pre class="bg-light p-3 rounded"><code>{{ example_request }}</code></pre>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
