{% extends 'base.html' %}

{% block content %}
<div class="container text-center">
    <div class="card">
        <div class="card-body">
            <h1 class="card-title">Verify User</h1>
            <p>Are you sure you want to verify {{ object.username }}?</p>
            
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-success me-2">Confirm Verification</button>
                <a href="{% url 'admin_panel:admin_user_detail' object.pk %}" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
